<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الأدمن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f4ef; --ink:#222; --muted:#777; --green:#2e9d5b; --red:#e0524f; --line:#e4e0d6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Cairo',system-ui,sans-serif; overflow-wrap:anywhere; }
  .row > *, .spread > * { min-width:0; }
  td, th { overflow-wrap:anywhere; }
  .wrap { max-width:900px; margin:0 auto; padding:16px 16px 80px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  h1 { font-size:1.3rem; margin:0; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; }
  .tab { padding:9px 18px; border-radius:10px; border:0; background:#e9e5da; font:inherit; font-weight:600; cursor:pointer; }
  .tab.on { background:#2b2b2b; color:#fff; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  button { font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .btn { border:0; border-radius:10px; padding:9px 16px; background:#2b2b2b; color:#fff; font-weight:600; }
  .btn.light { background:#ece8dd; color:#222; } .btn.danger { background:#fbe3e2; color:#b53a37; } .btn.green { background:var(--green); }
  .btn.sm { padding:5px 10px; font-size:.85rem; }
  input[type=text], input[type=password], input[type=email], textarea, select { width:100%; font:inherit; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; }
  textarea { resize:vertical; min-height:60px; }
  label.f { display:block; font-weight:600; font-size:.9rem; margin:12px 0 5px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > input[type=text] { flex:1; }
  .spread { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:.88rem; }
  .qbox { border:1.5px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; background:#fcfbf8; }
  .qhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-weight:700; }
  .link { direction:ltr; text-align:left; font-size:.85rem; color:#555; word-break:break-all; background:#f3f0e7; padding:6px 10px; border-radius:8px; }
  .badge { display:inline-block; font-size:.75rem; font-weight:600; background:#e8e3d5; color:#555; border-radius:99px; padding:2px 10px; margin-inline-start:6px; }
  .picker { text-align:center; background:#f7f3e8; }
  .hintbox { font-size:.85rem; color:var(--muted); background:#f3f0e7; border-radius:8px; padding:8px 10px; margin:6px 0; }
  .preview { font-size:.9rem; margin-top:8px; padding:8px 10px; background:#eef6f0; border-radius:8px; }
  .rte-tb { display:flex; flex-wrap:wrap; gap:4px; align-items:center; padding:6px; background:#f3f0e7; border:1.5px solid var(--line); border-bottom:0; border-radius:10px 10px 0 0; }
  .rte-tb button { min-width:30px; height:30px; padding:0 8px; border:1px solid #d8d2c2; background:#fff; border-radius:6px; font:inherit; font-size:.9rem; cursor:pointer; }
  .rte-tb button:hover { background:#eee9db; }
  .rte-tb .sw { width:22px; min-width:22px; height:22px; padding:0; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px #bbb; }
  .rte-tb select { width:auto; padding:3px 6px; font-size:.85rem; }
  .rte-tb .sep { width:1px; height:22px; background:#d8d2c2; margin:0 3px; }
  .rte { min-height:72px; padding:10px 12px; border:1.5px solid var(--line); border-radius:0 0 10px 10px; background:#fff; outline:none; line-height:1.9; font-size:1.05rem; }
  .rte:focus { border-color:#2b2b2b; }
  .rte:empty:before { content:attr(data-ph); color:#aaa; }
  .rte ul, .rte ol { margin:4px 0; padding-inline-start:26px; }
  .rte img { max-width:100%; max-height:320px; border-radius:8px; vertical-align:middle; margin:2px 0; }
  .rte img:not([src]) { display:inline-block; min-width:90px; min-height:60px; background:#e9e5da; }
  .imgprev img { max-width:100%; max-height:220px; border-radius:10px; display:block; margin-bottom:6px; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:10px 8px; text-align:right; border-bottom:1px solid var(--line); font-size:.95rem; }
  th { color:var(--muted); font-weight:600; font-size:.85rem; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-weight:700; font-size:.85rem; }
  .pill.ok { background:#d9f1e3; color:#1f7a44; } .pill.mid { background:#fbf0d2; color:#8a6a10; } .pill.no { background:#fbe3e2; color:#b53a37; }
  .detail td { background:#faf8f3; }
  .d-ok { color:var(--green); font-weight:700; } .d-no { color:var(--red); font-weight:700; }
  .err { color:var(--red); margin:8px 0; min-height:1.2em; }
  .overflow { overflow-x:auto; }
  .login { max-width:360px; margin:80px auto; }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="muted" style="text-align:center;margin-top:60px">جاري التحميل...</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const root = document.getElementById('root');
let view = 'login';          // login | exercises | editor | results
let EX = {}, AT = {};        // نسخة حيّة من الداتا (بتتحدث لوحدها)
let editing = null;
let resultsFilter = '';
let listening = false;
const openDetails = new Set();

/* ---------- Auth ---------- */
fauth.onAuthStateChanged(user => {
  if (user) startApp(); else { stopApp(); renderLogin(); }
});

function renderLogin(msg) {
  view = 'login';
  root.innerHTML = `<div class="card login"><h1 style="text-align:center">دخول الأدمن</h1>
    <label class="f">الإيميل</label><input type="email" id="em" autocomplete="username" dir="ltr">
    <label class="f">كلمة السر</label><input type="password" id="pw" autocomplete="current-password" dir="ltr">
    <div class="err" id="lerr">${esc(msg || '')}</div><button class="btn" style="width:100%" id="lbtn">دخول</button></div>`;
  const go = async () => {
    const btn = document.getElementById('lbtn'); btn.disabled = true;
    try { await fauth.signInWithEmailAndPassword(document.getElementById('em').value.trim(), document.getElementById('pw').value); }
    catch (e) { document.getElementById('lerr').textContent = 'الإيميل أو كلمة السر غلط'; btn.disabled = false; }
  };
  document.getElementById('lbtn').onclick = go;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function logout() { fauth.signOut(); }

function startApp() {
  if (listening) return;
  listening = true;
  fdb.ref('exercises').on('value', s => { EX = s.val() || {}; refresh(); }, notAdmin);
  fdb.ref('attempts').on('value', s => { AT = s.val() || {}; refresh(); }, notAdmin);
  showExercises();
}
function stopApp() {
  fdb.ref('exercises').off(); fdb.ref('attempts').off();
  listening = false; EX = {}; AT = {};
}
let kicked = false;
function notAdmin() {
  // الحساب دخل بس مش هو الأدمن (الـ UID مش في القواعد)
  if (kicked) return; kicked = true;
  fauth.signOut().then(() => { kicked = false; renderLogin('الحساب ده مش أدمن، أو مفيش صلاحية. تأكدي من الـ UID في القواعد.'); });
}
function refresh() {
  if (view === 'exercises') renderExercises();
  else if (view === 'results') renderResults();
}

/* ---------- Shell ---------- */
function shell(inner, active) {
  root.innerHTML = `<header><h1>📝 لوحة التمارين</h1><button class="btn light sm" onclick="logout()">خروج</button></header>
    <div class="tabs">
      <button class="tab ${active === 'exercises' ? 'on' : ''}" onclick="showExercises()">التمارين</button>
      <button class="tab ${active === 'results' ? 'on' : ''}" onclick="showResults()">النتائج</button>
    </div>${inner}`;
}
const exList = () => Object.entries(EX).map(([id, ex]) => ({ id, ...ex })).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
const quizLink = id => new URL('quiz.html?e=' + id, location.href).href;

/* ---------- Exercises list ---------- */
function showExercises() { view = 'exercises'; renderExercises(); }
function renderExercises() {
  const atts = Object.values(AT);
  const list = exList().length ? exList().map(ex => {
    const n = atts.filter(a => a.exerciseId === ex.id).length;
    return `<div class="card"><div class="spread"><div><b>${esc(ex.title)}</b>
      <div class="muted">${toArray(ex.questions).length} سؤال • ${n} محاولة</div></div>
      <div class="row"><button class="btn sm light" onclick="editExercise('${ex.id}')">تعديل</button>
      <button class="btn sm light" onclick="showResults('${ex.id}')">النتائج</button>
      <button class="btn sm danger" onclick="delExercise('${ex.id}')">حذف</button></div></div>
      <div class="row" style="margin-top:8px"><div class="link" style="flex:1">${esc(quizLink(ex.id))}</div>
      <button class="btn sm green" onclick="copyLink('${ex.id}', this)">نسخ اللينك</button></div></div>`;
  }).join('') : '<div class="card muted">لسه مفيش تمارين. اضغطي "تمرين جديد".</div>';
  shell(`<div style="margin-bottom:12px"><button class="btn" onclick="newExercise()">+ تمرين جديد</button></div>${list}`, 'exercises');
}
function copyLink(id, btn) {
  const done = () => { btn.textContent = 'تم ✓'; setTimeout(() => btn.textContent = 'نسخ اللينك', 1500); };
  (navigator.clipboard ? navigator.clipboard.writeText(quizLink(id)).then(done) : Promise.reject()).catch(() => prompt('انسخي اللينك:', quizLink(id)));
}
async function delExercise(id) {
  if (!confirm('هتمسحي التمرين وكل نتايجه. متأكدة؟')) return;
  const upd = { ['exercises/' + id]: null };
  const usedElsewhere = new Set(); Object.entries(EX).forEach(([eid, e]) => { if (eid !== id) imageIdsOfExercise(e).forEach(i => usedElsewhere.add(i)); });
  imageIdsOfExercise(EX[id]).forEach(i => { if (!usedElsewhere.has(i)) upd['images/' + i] = null; });
  Object.entries(AT).forEach(([aid, a]) => { if (a.exerciseId === id) upd['attempts/' + aid] = null; });
  try { await fdb.ref().update(upd); } catch (e) { alert('حصل خطأ في الحذف'); }
}

/* ---------- Editor ---------- */
const blankMcq = () => ({ type: 'mcq', id: '', context: '', contextHtml: '', text: '', textHtml: '', choices: ['', '', '', ''], correct: 0 });
const blankText = () => ({ type: 'text', id: '', context: '', contextHtml: '', text: '', textHtml: '', answers: '' });
const blankFill = () => ({ type: 'fill', id: '', context: '', contextHtml: '', text: '', textHtml: '', sentences: [''], extras: '' });
function newExercise() { editing = { title: '', questions: [], picking: true, pending: {} }; renderEditor(); }
function editExercise(id) {
  const ex = EX[id];
  editing = {
    id, createdAt: ex.createdAt, title: ex.title, picking: false, pending: {},
    questions: toArray(ex.questions).map(q => q.type === 'text'
      ? { type: 'text', id: q.id, context: q.context || '', contextHtml: q.contextHtml || plainToHtml(q.context || ''), text: q.text || '', textHtml: q.textHtml || plainToHtml(q.text || ''), answers: toArray(q.answers).join('\n') }
      : q.type === 'fill'
      ? { type: 'fill', id: q.id, context: q.context || '', contextHtml: q.contextHtml || plainToHtml(q.context || ''), text: q.text || '', textHtml: q.textHtml || plainToHtml(q.text || ''), sentences: toArray(q.sentences).length ? toArray(q.sentences) : [''], extras: toArray(q.extras).join('، ') }
      : { type: 'mcq', id: q.id, context: q.context || '', contextHtml: q.contextHtml || plainToHtml(q.context || ''), text: q.text, textHtml: q.textHtml || plainToHtml(q.text || ''), choices: toArray(q.choices), correct: q.correct })
  };
  renderEditor();
}

/* ---------- محرر النص المنسّق + الصور ---------- */
const RTE_COLORS = ['#111111', '#c0392b', '#1e8449', '#1f4e9c', '#d35400', '#7d3c98', '#7f8c8d'];
const RTE_MARKS = ['#fff3a3', '#cdeccf', '#cfe3ff', '#f9d2d2'];
function mountRte(host) {
  const qi = +host.dataset.qi, key = host.dataset.field + 'Html';
  const ed = document.createElement('div');
  ed.className = 'rte'; ed.contentEditable = 'true'; ed.dir = 'rtl'; ed.dataset.ph = host.dataset.ph || '';
  ed.innerHTML = sanitizeHtml(editing.questions[qi][key] || '');
  const save = () => { editing.questions[qi][key] = ed.innerHTML; };
  const run = (cmd, val) => { ed.focus(); document.execCommand('styleWithCSS', false, true); document.execCommand(cmd, false, val || null); save(); };
  const tb = document.createElement('div'); tb.className = 'rte-tb';
  const btn = (html, title, fn, cls) => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = html; b.title = title; if (cls) b.className = cls;
    b.onmousedown = e => e.preventDefault(); b.onclick = fn; tb.append(b); return b; };   // mousedown: عشان التحديد ميتفقدش
  const sep = () => { const d = document.createElement('span'); d.className = 'sep'; tb.append(d); };
  btn('<b>B</b>', 'عريض', () => run('bold'));
  btn('<i>I</i>', 'مائل', () => run('italic'));
  btn('<u>U</u>', 'تحته خط', () => run('underline'));
  sep();
  RTE_COLORS.forEach(c => { const b = btn('', 'لون الخط', () => run('foreColor', c), 'sw'); b.style.background = c; });
  sep();
  RTE_MARKS.forEach(c => { const b = btn('', 'تظليل', () => run('hiliteColor', c), 'sw'); b.style.background = c; });
  btn('✕', 'شيل التظليل', () => run('hiliteColor', 'transparent'));
  sep();
  const sz = document.createElement('select');
  sz.innerHTML = '<option value="">الحجم</option><option value="2">صغير</option><option value="3">عادي</option><option value="5">كبير</option><option value="6">كبير جدًا</option>';
  sz.onchange = () => { if (sz.value) run('fontSize', sz.value); sz.value = ''; };
  tb.append(sz); sep();
  btn('• ≡', 'قائمة نقطية', () => run('insertUnorderedList'));
  btn('⇔', 'في النص', () => run('justifyCenter'));
  btn('⌫', 'شيل كل التنسيق', () => run('removeFormat'));
  sep();
  // إدراج صورة جوه النص عند المؤشر
  const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*'; file.hidden = true;
  btn('🖼 صورة', 'إدراج صورة في النص', () => file.click());
  tb.append(file);
  let range = null;
  const keep = () => { const sel = getSelection(); if (sel.rangeCount && ed.contains(sel.anchorNode)) range = sel.getRangeAt(0).cloneRange(); };
  ['keyup', 'mouseup', 'input', 'focus'].forEach(ev => ed.addEventListener(ev, keep));
  file.onchange = async () => {
    const f = file.files[0]; file.value = ''; if (!f) return;
    try {
      const d = await compressImage(f), id = newId(8);
      editing.pending[id] = d;
      ed.focus(); if (range) { const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); }
      document.execCommand('insertHTML', false, `<img data-img="${id}" src="${d.data}">`); save();
    } catch (e) { alert(e.message); }
  };
  ed.oninput = save;
  ed.onpaste = e => {   // اللصق دايمًا بعد تنضيفه
    e.preventDefault();
    const cd = e.clipboardData, h = cd.getData('text/html');
    if (h) document.execCommand('insertHTML', false, sanitizeHtml(h)); else document.execCommand('insertText', false, cd.getData('text/plain'));
    save();
  };
  host.append(tb, ed);
}
function hydrateEditor() {
  document.querySelectorAll('.rte-host').forEach(mountRte);
  document.querySelectorAll('.rte-host .rte').forEach(ed => hydrateImages(ed, editing.pending));
}

function mcqBox(q, qi) {
  return `<div class="qbox">
    <div class="qhead"><span>سؤال ${qi + 1} <span class="badge">اختيارات</span></span>
      <button class="btn sm danger" onclick="removeQ(${qi})">حذف السؤال</button></div>
    <label class="f">نص/مثال فوق السؤال (اختياري)</label>
    <div class="rte-host" data-qi="${qi}" data-field="context" data-ph="مثلاً: الآية أو الجملة اللي هيتسأل عنها"></div>
    <label class="f">السؤال</label>
    <div class="rte-host" data-qi="${qi}" data-field="text" data-ph="اكتبي السؤال هنا"></div>
    <label class="f">الاختيارات (حددي الإجابة الصحيحة بالدايرة)</label>
    ${q.choices.map((c, ci) => `<div class="row" style="margin-bottom:6px">
      <input type="radio" name="correct${qi}" ${q.correct === ci ? 'checked' : ''} onchange="editing.questions[${qi}].correct=${ci}" style="width:20px;height:20px">
      <input type="text" value="${esc(c)}" oninput="editing.questions[${qi}].choices[${ci}]=this.value" placeholder="اختيار ${ci + 1}">
      <button class="btn sm danger" onclick="removeChoice(${qi},${ci})" ${q.choices.length <= 2 ? 'disabled' : ''}>✕</button></div>`).join('')}
    <button class="btn sm light" onclick="addChoice(${qi})">+ اختيار</button>
  </div>`;
}
function fillBox(q, qi) {
  return `<div class="qbox">
    <div class="qhead"><span>سؤال ${qi + 1} <span class="badge">اسحب الكلمة للفراغ</span></span>
      <button class="btn sm danger" onclick="removeQ(${qi})">حذف السؤال</button></div>
    <label class="f">نص/مثال فوق السؤال (اختياري)</label>
    <div class="rte-host" data-qi="${qi}" data-field="context" data-ph="مثلاً: الآية أو الجملة اللي هيتسأل عنها"></div>
    <label class="f">التعليمات (اختياري)</label>
    <div class="rte-host" data-qi="${qi}" data-field="text" data-ph="اسحبي الكلمات للأماكن الفاضية"></div>
    <label class="f">الجمل</label>
    <div class="hintbox">اكتبي الجملة كاملة وحطي الكلمة الناقصة بين <b dir="ltr">[[ ]]</b>. مثال: <b>الله [[غفور]] رحيم</b>. تقدري تحطي أكتر من فراغ في نفس الجملة.</div>
    ${q.sentences.map((st, si) => `<div class="row" style="margin-bottom:6px">
      <input type="text" value="${esc(st)}" oninput="editing.questions[${qi}].sentences[${si}]=this.value;updatePreview(${qi})" placeholder="جملة ${si + 1}">
      <button class="btn sm danger" onclick="removeSentence(${qi},${si})" ${q.sentences.length <= 1 ? 'disabled' : ''}>✕</button></div>`).join('')}
    <button class="btn sm light" onclick="addSentence(${qi})">+ جملة</button>
    <label class="f">كلمات زيادة تلخبط (اختياري، افصلي بينها بفاصلة)</label>
    <input type="text" value="${esc(q.extras)}" oninput="editing.questions[${qi}].extras=this.value;updatePreview(${qi})" placeholder="مثلاً: عزيز، حكيم">
    <div class="preview" id="pv-${qi}">${esc(fillWords(q).join(' • ') || 'لسه مفيش كلمات')}</div>
  </div>`;
}
function textBox(q, qi) {
  return `<div class="qbox">
    <div class="qhead"><span>سؤال ${qi + 1} <span class="badge">إجابة مكتوبة</span></span>
      <button class="btn sm danger" onclick="removeQ(${qi})">حذف السؤال</button></div>
    <label class="f">نص/مثال فوق السؤال (اختياري)</label>
    <div class="rte-host" data-qi="${qi}" data-field="context" data-ph="مثلاً: الآية أو الجملة اللي هيتسأل عنها"></div>
    <label class="f">السؤال</label>
    <div class="rte-host" data-qi="${qi}" data-field="text" data-ph="اكتبي السؤال هنا"></div>
    <label class="f">الإجابة النموذجية (بتظهر للطالبة بعد ما تجاوب)</label>
    <div class="hintbox">الطالبة بتكتب إجابتها، وبعدين <b>بتشوف الإجابة النموذجية وتقيّم نفسها</b> (صح أو غلط)، والدرجة بتتحسب حسب تقييمها. لو الإجابة النموذجية فيها أكتر من سطر بتظهر كلها زي ما هي.</div>
    <textarea oninput="editing.questions[${qi}].answers=this.value" placeholder="اكتبي الإجابة النموذجية">${esc(q.answers)}</textarea>
  </div>`;
}
function fillWords(q) {
  const w = [];
  q.sentences.forEach(s => parseSentence(s).forEach(p => { if (p.t === 'blank' && p.v) w.push(p.v); }));
  q.extras.split(/[,،]/).map(x => x.trim()).filter(Boolean).forEach(x => w.push(x + ' (زيادة)'));
  return w;
}
function updatePreview(qi) {
  const e = document.getElementById('pv-' + qi);
  if (e) e.textContent = 'الكلمات: ' + (fillWords(editing.questions[qi]).join(' • ') || 'لسه مفيش كلمات');
}

function renderEditor() {
  view = 'editor';
  const qs = editing.questions.map((q, qi) => q.type === 'fill' ? fillBox(q, qi) : q.type === 'text' ? textBox(q, qi) : mcqBox(q, qi)).join('');
  const picker = editing.picking
    ? `<div class="qbox picker"><b>اختاري نوع السؤال</b>
        <div class="row" style="margin-top:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn" onclick="addQ('mcq')">☑️ اختيارات</button>
          <button class="btn" onclick="addQ('fill')">🧩 اسحب الكلمة للفراغ</button>
          <button class="btn" onclick="addQ('text')">✍️ إجابة مكتوبة</button>
          ${editing.questions.length ? '<button class="btn light" onclick="editing.picking=false;renderEditor()">إلغاء</button>' : ''}
        </div></div>`
    : `<button class="btn light" onclick="editing.picking=true;renderEditor();window.scrollTo(0,document.body.scrollHeight)">+ سؤال جديد</button>`;
  shell(`<div class="card">
    <label class="f" style="margin-top:0">عنوان التمرين</label>
    <input type="text" value="${esc(editing.title)}" oninput="editing.title=this.value" placeholder="مثلاً: تحدي الشاطبية - فرش السور">
    ${qs}
    ${picker}
    <div class="err" id="eerr"></div>
    <div class="row"><button class="btn green" id="savebtn" onclick="saveExercise()">حفظ التمرين</button>
    <button class="btn light" onclick="showExercises()">إلغاء</button></div></div>`, 'exercises');
  hydrateEditor();
}
function addQ(type) {
  editing.questions.push(type === 'fill' ? blankFill() : type === 'text' ? blankText() : blankMcq());
  editing.picking = false; renderEditor();
  const boxes = document.querySelectorAll('.qbox'); boxes[boxes.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function removeQ(i) { editing.questions.splice(i, 1); if (!editing.questions.length) editing.picking = true; renderEditor(); }
function addChoice(qi) { editing.questions[qi].choices.push(''); renderEditor(); }
function removeChoice(qi, ci) {
  const q = editing.questions[qi]; q.choices.splice(ci, 1);
  if (q.correct === ci) q.correct = 0; else if (q.correct > ci) q.correct--;
  renderEditor();
}
function addSentence(qi) { editing.questions[qi].sentences.push(''); renderEditor(); }
function removeSentence(qi, si) { editing.questions[qi].sentences.splice(si, 1); renderEditor(); }

// تجهيز نص السؤال والمثال (منسّق) للحفظ — نفس الشغل لكل أنواع الأسئلة
function richFields(q) {
  const textHtml = sanitizeHtml(q.textHtml || ''), contextHtml = sanitizeHtml(q.contextHtml || '');
  const plain = htmlToText(textHtml), hasImg = imageIdsIn(textHtml).length > 0;
  return { textHtml, contextHtml, context: htmlToText(contextHtml), text: plain || (hasImg ? '(سؤال بصورة)' : ''), hasText: !!(plain || hasImg) };
}
function applyRich(item, r) {
  item.context = r.context; item.text = r.text;
  if (r.contextHtml) item.contextHtml = r.contextHtml;
  if (r.textHtml) item.textHtml = r.textHtml;
  return item;
}

async function saveExercise() {
  const err = document.getElementById('eerr');
  const title = editing.title.trim();
  if (!title) { err.textContent = 'اكتبي عنوان للتمرين'; return; }
  if (!editing.questions.length) { err.textContent = 'أضيفي سؤال واحد على الأقل'; return; }
  const questions = [];
  for (let i = 0; i < editing.questions.length; i++) {
    const q = editing.questions[i], n = i + 1;
    if (q.type === 'text') {
      const r = richFields(q);
      if (!r.hasText) { err.textContent = `السؤال رقم ${n} فاضي`; return; }
      const answers = q.answers.split('\n').map(x => x.trim()).filter(Boolean);
      if (!answers.length) { err.textContent = `السؤال رقم ${n}: اكتبي الإجابة النموذجية`; return; }
      questions.push(applyRich({ id: q.id || newId(4), type: 'text', answers }, r));
    } else if (q.type === 'fill') {
      const sents = q.sentences.map(x => x.trim()).filter(Boolean);
      if (!sents.length) { err.textContent = `السؤال رقم ${n}: اكتبي جملة واحدة على الأقل`; return; }
      let blanks = 0;
      for (const st of sents) {
        const parts = parseSentence(st);
        for (const p of parts) {
          if (p.t === 'blank') { if (!p.v) { err.textContent = `السؤال رقم ${n}: في فراغ [[ ]] من غير كلمة`; return; } blanks++; }
          else if (p.v.includes('[[') || p.v.includes(']]')) { err.textContent = `السؤال رقم ${n}: القوسين [[ ]] مش مكتملين في "${st}"`; return; }
        }
      }
      if (!blanks) { err.textContent = `السؤال رقم ${n}: لازم تحطي كلمة ناقصة واحدة على الأقل بين [[ ]]`; return; }
      const extras = q.extras.split(/[,،]/).map(x => x.trim()).filter(Boolean);
      questions.push(applyRich({ id: q.id || newId(4), type: 'fill', sentences: sents, extras }, richFields(q)));
    } else {
      const r = richFields(q);
      if (!r.hasText) { err.textContent = `السؤال رقم ${n} فاضي`; return; }
      const keep = q.choices.map((c, idx) => ({ c: c.trim(), idx })).filter(x => x.c);
      if (keep.length < 2) { err.textContent = `السؤال رقم ${n} لازم يكون فيه اختيارين على الأقل`; return; }
      const correct = keep.findIndex(x => x.idx === q.correct);
      if (correct < 0) { err.textContent = `الإجابة الصحيحة في السؤال رقم ${n} مش مكتوبة (الاختيار فاضي)`; return; }
      questions.push(applyRich({ id: q.id || newId(4), type: 'mcq', choices: keep.map(x => x.c), correct }, r));
    }
  }
  const id = editing.id || newId(6);
  const btn = document.getElementById('savebtn'); btn.disabled = true;
  try {
    // كله في عملية واحدة: التمرين + الصور الجديدة + مسح الصور القديمة
    const usedElsewhere = new Set(); Object.entries(EX).forEach(([eid, e]) => { if (eid !== id) imageIdsOfExercise(e).forEach(i => usedElsewhere.add(i)); });
    const newIds = imageIdsOfExercise({ questions }), oldIds = imageIdsOfExercise(EX[id]);
    const upd = { ['exercises/' + id]: { title, questions, createdAt: editing.createdAt || new Date().toISOString() } };
    newIds.forEach(i => { const p = editing.pending[i]; if (p) upd['images/' + i] = { data: p.data, w: p.w, h: p.h }; });   // الصور الجديدة
    oldIds.forEach(i => { if (!newIds.has(i) && !usedElsewhere.has(i)) upd['images/' + i] = null; });                      // صور اتشالت من النص
    await fdb.ref().update(upd);
    showExercises();
  } catch (e) { err.textContent = 'مقدرتش أحفظ. اتأكدي إنك داخلة بحساب الأدمن وإن القواعد منشورة.'; btn.disabled = false; }
}

/* ---------- Results ---------- */
function showResults(exId) {
  view = 'results';
  if (exId !== undefined) resultsFilter = exId;
  renderResults();
}
function renderResults() {
  const list = Object.entries(AT)
    .map(([id, a]) => ({ id, ...a, answers: Object.values(a.answers || {}).sort((x, y) => String(x.at).localeCompare(String(y.at))) }))
    .filter(a => !resultsFilter || a.exerciseId === resultsFilter)
    .sort((x, y) => String(y.startedAt).localeCompare(String(x.startedAt)));
  const opts = `<option value="">كل التمارين</option>` + exList().map(e => `<option value="${e.id}" ${e.id === resultsFilter ? 'selected' : ''}>${esc(e.title)}</option>`).join('');
  const rows = list.map(a => {
    const score = a.answers.filter(x => x.isCorrect).length;
    const pct = a.total ? Math.round(score / a.total * 100) : 0;
    const cls = pct >= 70 ? 'ok' : pct >= 40 ? 'mid' : 'no';
    const dt = new Date(a.startedAt).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
    const open = openDetails.has(a.id);
    return `<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.exerciseTitle)}</td>
      <td><span class="pill ${cls}">${score} / ${a.total}</span></td>
      <td>${a.finishedAt ? 'خلّص' : `<span class="muted">${a.answers.length}/${a.total} جاوب</span>`}</td>
      <td class="muted">${esc(dt)}</td>
      <td><button class="btn sm light" onclick="toggleDetail('${a.id}')">تفاصيل</button>
          <button class="btn sm danger" onclick="delAttempt('${a.id}')">حذف</button></td></tr>
      <tr class="detail" id="d-${a.id}" style="display:${open ? 'table-row' : 'none'}"><td colspan="6">${
        a.answers.length ? a.answers.map((x, i) => `<div style="margin:6px 0"><span class="${x.isCorrect ? 'd-ok' : 'd-no'}">${x.isCorrect ? '✓' : '✗'}</span>
          ${i + 1}. ${esc(x.questionText)} — ${x.type === 'text' ? 'كتبت' : 'اختارت'}: <b>${esc(x.chosenText)}</b>${x.type === 'text' ? ` <span class="muted">(الإجابة النموذجية: ${esc(x.correctText)}) • تقييم ذاتي</span>` : ''}${x.isCorrect || x.type === 'text' ? '' : ` <span class="muted">(الصح: ${esc(x.correctText)})</span>`}</div>`).join('') : '<span class="muted">لسه ما جاوبتش</span>'}</td></tr>`;
  }).join('');
  shell(`<div class="card"><div class="spread" style="margin-bottom:10px"><b>نتائج المستخدمين (${list.length})</b>
    <select id="rf" style="width:auto;min-width:200px" onchange="showResults(this.value)">${opts}</select></div>
    <div class="overflow">${list.length ? `<table><thead><tr><th>الاسم</th><th>التمرين</th><th>الدرجة</th><th>الحالة</th><th>الوقت</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="muted">مفيش نتايج لسه.</div>'}</div></div>`, 'results');
}
function toggleDetail(id) {
  const r = document.getElementById('d-' + id);
  if (openDetails.has(id)) { openDetails.delete(id); r.style.display = 'none'; } else { openDetails.add(id); r.style.display = 'table-row'; }
}
async function delAttempt(id) {
  if (!confirm('تمسحي النتيجة دي؟')) return;
  try { await fdb.ref('attempts/' + id).remove(); } catch (e) { alert('حصل خطأ في الحذف'); }
}
</script>
