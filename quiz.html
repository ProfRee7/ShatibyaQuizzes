<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تمرين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#222; --muted:#777; --green:#2e9d5b; --red:#e0524f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Cairo',system-ui,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.3rem; margin:8px 0 18px; text-align:center; }
  .card { background:var(--card); border-radius:16px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .ctx { background:#fbf4e6; border:1px solid #e8d9b5; border-radius:14px; padding:18px; text-align:center; font-size:1.4rem; line-height:2; margin-bottom:18px; white-space:pre-wrap; }
  .q { font-size:1.15rem; font-weight:700; margin:0 0 14px; white-space:pre-wrap; }
  .progress { height:8px; background:#e6e2d8; border-radius:99px; overflow:hidden; margin-bottom:6px; }
  .progress > div { height:100%; background:var(--green); transition:width .3s; }
  .pinfo { font-size:.85rem; color:var(--muted); margin-bottom:16px; text-align:center; }
  .choice { display:block; width:100%; text-align:center; border:2px solid transparent; border-radius:12px; padding:16px; margin:10px 0; font:inherit; font-size:1.05rem; cursor:pointer; transition:transform .05s, opacity .2s; color:#333; white-space:pre-wrap; }
  .choice:active { transform:scale(.99); }
  .c0 { background:#f8d9d9; } .c1 { background:#c9ece8; } .c2 { background:#f7e7c2; } .c3 { background:#d9d9f7; } .c4 { background:#e3f1c9; } .c5 { background:#f3d3ea; }
  .choice.correct { background:var(--green); color:#fff; border-color:#1f7a44; }
  .choice.wrong { background:var(--red); color:#fff; border-color:#b53a37; }
  .choice.dim { opacity:.45; }
  .choice:disabled { cursor:default; }
  .feedback { text-align:center; font-weight:700; font-size:1.1rem; margin:14px 0 4px; }
  .feedback.ok { color:var(--green); } .feedback.no { color:var(--red); }
  button.primary { display:block; width:100%; background:#2b2b2b; color:#fff; border:0; border-radius:12px; padding:14px; font:inherit; font-size:1.05rem; font-weight:600; cursor:pointer; margin-top:14px; }
  input[type=text] { width:100%; font:inherit; font-size:1.05rem; padding:14px; border:2px solid #ddd; border-radius:12px; margin:12px 0 4px; text-align:center; }
  .score { font-size:3rem; font-weight:700; text-align:center; margin:6px 0; }
  .review { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
  .dot { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; }
  .dot.ok { background:var(--green); } .dot.no { background:var(--red); }
  .err { color:var(--red); text-align:center; margin-top:8px; min-height:1.2em; }
  .center { text-align:center; color:var(--muted); }
  /* أسئلة اسحب الكلمة */
  .bank { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:14px; background:#f1eee5; border-radius:14px; margin:6px 0 18px; min-height:62px; border:2px dashed transparent; }
  .bank.over, .bank.armed { border-color:#b9b1a0; }
  .chip { touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; background:#fff; border:2px solid #d8d2c2; border-radius:10px; padding:8px 14px; font-size:1.1rem; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .chip.sel { border-color:#2b2b2b; background:#fff8d9; }
  .chip.lifting { opacity:.35; }
  .chip.ghost { position:fixed; z-index:99; pointer-events:none; transform:translate(-50%,-50%); box-shadow:0 6px 18px rgba(0,0,0,.25); }
  .sent { font-size:1.2rem; line-height:2.8; margin:8px 0; text-align:right; white-space:pre-wrap; }
  .slot { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; min-width:84px; min-height:44px; padding:2px 6px; margin:0 4px; border:2px dashed #b9b1a0; border-radius:10px; vertical-align:middle; background:#faf8f3; line-height:1.4; }
  .slot.over, .slot.armed { border-color:#2b2b2b; background:#fff8d9; }
  .slot .chip { margin:0; }
  .slot.ok { border:2px solid var(--green); background:#e2f5ea; color:#1f7a44; font-weight:700; }
  .slot.no { border:2px solid var(--red); background:#fdeceb; color:#b53a37; font-weight:700; }
  .fix { font-size:.8rem; color:var(--green); font-weight:600; }
  .hint { text-align:center; color:var(--muted); font-size:.9rem; margin:-8px 0 12px; }
  button.primary:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<div class="wrap"><h1 id="title"></h1><div id="app" class="center">جاري التحميل...</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const exId = (new URLSearchParams(location.search).get('e') || '').replace(/[^\w-]/g, '');
const KEY = 'attempt_' + exId;
const app = document.getElementById('app');
const titleEl = document.getElementById('title');
let exercise = null; // {title, questions:[{id,context,text,choices,correct}]}
let state = null;    // {attemptId, name, answers:{qid:{chosen,correctIndex,isCorrect}}}
let current = 0;

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e[k] = v;
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => e.append(c));
  return e;
}

async function init() {
  if (!exId) { app.textContent = 'اللينك ناقص أو غلط'; return; }
  let ex;
  try { ex = (await fdb.ref('exercises/' + exId).once('value')).val(); }
  catch (e) { app.textContent = 'تعذّر تحميل التمرين. تأكدي من الإنترنت وحاولي تاني.'; return; }
  if (!ex) { app.textContent = 'التمرين مش موجود'; return; }
  exercise = {
    title: ex.title,
    questions: toArray(ex.questions).map(q => q.type === 'fill'
      ? { id: q.id, type: 'fill', context: q.context || '', text: q.text || 'اسحبي الكلمات للأماكن الفاضية', sentences: toArray(q.sentences), extras: toArray(q.extras) }
      : { id: q.id, type: 'mcq', context: q.context || '', text: q.text, choices: toArray(q.choices), correct: q.correct })
  };
  titleEl.textContent = ex.title;
  document.title = ex.title;

  // لو الضيف كان بدأ قبل كده من نفس الجهاز يكمّل من مكانه
  const saved = lsGet(KEY);
  if (saved) {
    try {
      const a = (await fdb.ref('attempts/' + saved).once('value')).val();
      if (a && a.exerciseId === exId) {
        state = { attemptId: saved, name: a.name, answers: a.answers || {} };
        return startQuiz();
      }
    } catch (e) {}
    lsDel(KEY);
  }
  showNameForm();
}

function showNameForm() {
  const input = el('input', { type: 'text', placeholder: 'اكتبي اسمك', maxlength: 60 });
  const err = el('div', { class: 'err' });
  const btn = el('button', { class: 'primary' }, 'ابدأ');
  const go = async () => {
    const name = input.value.trim().slice(0, 60);
    if (!name) { err.textContent = 'اكتبي اسمك الأول'; return; }
    btn.disabled = true;
    const attemptId = newId(10);
    try {
      await fdb.ref('attempts/' + attemptId).set({
        exerciseId: exId, exerciseTitle: exercise.title, name,
        startedAt: new Date().toISOString(), total: exercise.questions.length
      });
      lsSet(KEY, attemptId);
      state = { attemptId, name, answers: {} };
      startQuiz();
    } catch (e) { err.textContent = 'حصل خطأ، حاولي تاني.'; btn.disabled = false; }
  };
  btn.onclick = go;
  input.onkeydown = e => { if (e.key === 'Enter') go(); };
  app.replaceChildren(el('div', { class: 'card' },
    el('div', { class: 'q', style: 'text-align:center' }, 'أهلاً بيكي 👋'),
    el('div', { class: 'center' }, `التمرين فيه ${exercise.questions.length} سؤال`),
    input, err, btn));
  input.focus();
}

function startQuiz() {
  const firstOpen = exercise.questions.findIndex(q => !state.answers[q.id]);
  current = firstOpen === -1 ? exercise.questions.length : firstOpen;
  render();
}

function render() {
  const qs = exercise.questions;
  if (current >= qs.length) return renderDone();
  const q = qs[current];
  const ans = state.answers[q.id];
  const total = qs.length;
  const answeredCount = qs.filter(x => state.answers[x.id]).length;

  const card = el('div', { class: 'card' },
    el('div', { class: 'progress' }, el('div', { style: `width:${answeredCount / total * 100}%` })),
    el('div', { class: 'pinfo' }, `سؤال ${current + 1} من ${total}`));
  if (q.context) card.append(el('div', { class: 'ctx' }, q.context));
  card.append(el('p', { class: 'q' }, q.text));

  if (q.type === 'fill') renderFill(card, q, ans);
  else renderMcq(card, q, ans);

  if (ans) {
    card.append(el('div', { class: 'feedback ' + (ans.isCorrect ? 'ok' : 'no') }, ans.isCorrect ? '✅ إجابة صحيحة' : '❌ إجابة غلط'));
    const last = current === total - 1;
    card.append(el('button', { class: 'primary', onclick: () => { current++; render(); } }, last ? 'عرض النتيجة' : 'السؤال التالي'));
  }
  app.replaceChildren(card);
}

/* ---------- اختيارات ---------- */
function renderMcq(card, q, ans) {
  const btns = q.choices.map((c, i) => {
    const b = el('button', { class: 'choice c' + (i % 6) }, c);
    if (ans) {
      b.disabled = true;
      if (i === ans.correctIndex) b.className = 'choice correct';
      else if (i === ans.chosen) b.className = 'choice wrong';
      else b.classList.add('dim');
    } else {
      b.onclick = () => chooseMcq(q, i, btns);
    }
    return b;
  });
  card.append(...btns);
}
async function chooseMcq(q, i, btns) {
  btns.forEach(b => b.disabled = true);
  const rec = {
    questionId: q.id, type: 'mcq', questionText: q.text, chosen: i, chosenText: q.choices[i],
    correctIndex: q.correct, correctText: q.choices[q.correct],
    isCorrect: i === q.correct, at: new Date().toISOString()
  };
  try { await saveAnswer(q, rec); render(); }
  catch (e) { btns.forEach(b => b.disabled = false); alert('حصل خطأ في حفظ الإجابة، حاولي تاني.'); }
}
async function saveAnswer(q, rec) {
  const upd = { ['answers/' + q.id]: rec };
  const answeredAfter = exercise.questions.filter(x => state.answers[x.id] || x.id === q.id).length;
  if (answeredAfter >= exercise.questions.length) upd.finishedAt = new Date().toISOString();
  await fdb.ref('attempts/' + state.attemptId).update(upd);
  state.answers[q.id] = rec;
}

/* ---------- اسحب الكلمة ---------- */
const fillUI = {}; // لكل سؤال: {tokens, placed:[tokenId|null لكل فراغ], sel}
function fillModel(q) {
  if (q._m) return q._m;
  let n = 0; const answers = [];
  const sentences = q.sentences.map(s => parseSentence(s).map(p => {
    if (p.t === 'blank') { answers.push(p.v); return { blank: true, idx: n++ }; }
    return { text: p.v };
  }));
  return (q._m = { sentences, answers });
}
function fillState(q) {
  if (!fillUI[q.id]) {
    const m = fillModel(q);
    const tokens = shuffled([...m.answers.map((w, i) => ({ id: 'a' + i, text: w })), ...q.extras.map((w, i) => ({ id: 'x' + i, text: w }))]);
    fillUI[q.id] = { tokens, placed: m.answers.map(() => null), sel: null };
  }
  return fillUI[q.id];
}

function renderFill(card, q, ans) {
  const m = fillModel(q);
  const sentEls = (slotFn) => m.sentences.map(parts =>
    el('div', { class: 'sent' }, parts.map(p => p.blank ? slotFn(p.idx) : document.createTextNode(p.text))));

  // بعد الإجابة: عرض النتيجة لكل فراغ
  if (ans) {
    const blanks = toArray(ans.blanks);
    card.append(...sentEls(i => {
      const b = blanks[i] || { chosenText: '', correctText: '', ok: false };
      return el('span', { class: 'slot ' + (b.ok ? 'ok' : 'no') }, b.chosenText, b.ok ? '' : el('span', { class: 'fix' }, '✔ ' + b.correctText));
    }));
    return;
  }

  const ui = fillState(q);
  const tok = id => ui.tokens.find(t => t.id === id);
  const armed = !!ui.sel;
  const rerender = () => render();

  const bank = el('div', { class: 'bank' + (armed ? ' armed' : ''), 'data-zone': 'bank' });
  bank.onclick = () => { if (ui.sel) { dropToken(ui, ui.sel, { bank: true }); rerender(); } };
  const unplaced = ui.tokens.filter(t => !ui.placed.includes(t.id));
  if (unplaced.length) unplaced.forEach(t => bank.append(makeChip(t, ui, rerender)));
  else bank.append(el('span', { class: 'center' }, '✓ كل الكلمات اتحطت'));

  card.append(el('div', { class: 'hint' }, 'اسحبي الكلمة للمكان الفاضي (أو اضغطي على الكلمة ثم على المكان)'), bank);
  card.append(...sentEls(i => {
    const slot = el('span', { class: 'slot' + (armed ? ' armed' : ''), 'data-idx': String(i) });
    slot.onclick = () => { if (ui.sel) { dropToken(ui, ui.sel, { slot: i }); rerender(); } };
    if (ui.placed[i]) slot.append(makeChip(tok(ui.placed[i]), ui, rerender));
    return slot;
  }));

  const check = el('button', { class: 'primary' }, 'تحقق');
  check.disabled = !ui.placed.every(Boolean);
  check.onclick = async () => {
    check.disabled = true;
    const blanks = m.answers.map((a, i) => { const t = tok(ui.placed[i]); return { chosenText: t.text, correctText: a, ok: t.text === a }; });
    const rec = {
      questionId: q.id, type: 'fill',
      questionText: m.sentences.map(ps => ps.map(p => p.blank ? '____' : p.text).join('')).join(' / '),
      chosenText: blanks.map(b => b.chosenText).join('، '), correctText: blanks.map(b => b.correctText).join('، '),
      isCorrect: blanks.every(b => b.ok), blanks, at: new Date().toISOString()
    };
    try { await saveAnswer(q, rec); render(); }
    catch (e) { check.disabled = false; alert('حصل خطأ في حفظ الإجابة، حاولي تاني.'); }
  };
  card.append(check);
}

// نقل كلمة: zone = {slot:i} أو {bank:true} أو null
function dropToken(ui, tid, zone) {
  const from = ui.placed.indexOf(tid);
  if (zone && zone.slot !== undefined) {
    const occupant = ui.placed[zone.slot];
    if (from >= 0) ui.placed[from] = occupant === tid ? null : occupant; // تبديل
    ui.placed[zone.slot] = tid;
  } else if (from >= 0) {
    ui.placed[from] = null; // رجوع للبنك
  }
  ui.sel = null;
}
function zoneAt(x, y) {
  const n = document.elementFromPoint(x, y);
  const z = n && n.closest('.slot[data-idx], .bank');
  if (!z) return null;
  return z.classList.contains('slot') ? { slot: +z.dataset.idx, el: z } : { bank: true, el: z };
}

// كلمة تتسحب (ماوس أو لمس) أو تتضغط عليها لاختيارها
function makeChip(t, ui, rerender) {
  const c = el('div', { class: 'chip' + (ui.sel === t.id ? ' sel' : '') }, t.text);
  c.onclick = e => e.stopPropagation();
  c.onpointerdown = e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY; let moved = false, ghost = null, hover = null;
    const move = ev => {
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
      if (!moved) { moved = true; ghost = c.cloneNode(true); ghost.classList.add('ghost'); document.body.append(ghost); c.classList.add('lifting'); }
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      const z = zoneAt(ev.clientX, ev.clientY);
      if (hover && (!z || hover !== z.el)) hover.classList.remove('over');
      hover = z ? z.el : null; if (hover) hover.classList.add('over');
      ev.preventDefault();
    };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      if (ghost) ghost.remove();
      if (hover) hover.classList.remove('over');
      if (moved) {
        dropToken(ui, t.id, ev.type === 'pointercancel' ? null : zoneAt(ev.clientX, ev.clientY));
      } else {
        ui.sel = ui.sel === t.id ? null : t.id; // ضغطة = اختيار/إلغاء اختيار
      }
      rerender();
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  };
  return c;
}

function renderDone() {
  const qs = exercise.questions;
  const score = qs.filter(q => state.answers[q.id] && state.answers[q.id].isCorrect).length;
  const emoji = score === qs.length ? '🎉' : score >= qs.length / 2 ? '👏' : '💪';
  app.replaceChildren(el('div', { class: 'card' },
    el('div', { class: 'center' }, `برافو يا ${state.name}`),
    el('div', { class: 'score' }, `${score} / ${qs.length} ${emoji}`),
    el('div', { class: 'review' }, qs.map((q, i) => {
      const a = state.answers[q.id];
      return el('div', { class: 'dot ' + (a && a.isCorrect ? 'ok' : 'no'), title: q.text }, String(i + 1));
    })),
    el('button', { class: 'primary', onclick: () => { current = 0; render(); } }, 'راجعي إجاباتك')));
}

init();
</script>
</body>
</html>
